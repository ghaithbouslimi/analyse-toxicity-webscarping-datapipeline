[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analyse-toxicite"
version = "0.1.0"
description = "Collecte de presse, analyse de toxicité et API persistante"
requires-python = ">=3.11,<3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5", "feedparser>=6,<7", "httpx>=0.28,<1",
  "trafilatura>=2,<3", "pymongo>=4.11,<5", "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3", "uvicorn>=0.34,<1", "PyYAML>=6,<7",
  "transformers>=4.57,<5", "torch>=2.6,<3", "sentencepiece>=0.2,<1", "protobuf>=5,<8",
  "matplotlib>=3.9,<4", "psutil>=6,<8"
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mongomock>=4.3,<5"]

[project.scripts]
toxicite = "analyse_toxicite.cli:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
