name: analyse-toxicite
services:
  mongodb:
    image: mongo:8.0@sha256:d97fea17ccb8d004cd137be8dab54d70d0df11be69c9f422aefe4484c8414ab7
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--quiet"]
    cpus: "${MONGO_CPUS:-0.5}"
    mem_limit: "${MONGO_MEMORY_LIMIT:-512m}"
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --norc
        - --nodb
        - --eval
        - 'const connection = new Mongo("mongodb://127.0.0.1:27017/?directConnection=true&serverSelectionTimeoutMS=5000"); quit(connection.getDB("admin").runCommand({ping:1}).ok ? 0 : 1)'
      interval: 30s
      timeout: 30s
      retries: 12
      start_period: 30s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  api:
    build: .
    cpus: "${API_CPUS:-1.0}"
    mem_limit: "${API_MEMORY_LIMIT:-2g}"
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MODEL_CACHE_DIR: /app/cache/modeles
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8005}:${API_PORT:-8000}"
    volumes:
      - ${MODEL_CACHE_VOLUME:-cache_modeles}:/app/cache/modeles
      - ./rapports:/app/rapports
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://localhost:'+os.getenv('API_PORT','8000')+'/ready',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  mongo_data:
  cache_modeles:
